name: ci

on:
  push: { branches: [main] }
  pull_request:

concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }

permissions: { contents: read }

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: make lint
      - name: Testes (unitários + integração, cobertura >= 85%)
        run: make test
      - name: Smoke de treino rápido
        run: PYTHONPATH=src python -m fraudguard.modeling.train --synthetic-rows 40000 --fast --no-plots

  container:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (treina o modelo dentro do build)
        uses: docker/build-push-action@v6
        with: { context: ., target: runtime, tags: "fraudguard:ci", load: true, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Scan de vulnerabilidades (reporta CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "fraudguard:ci", severity: CRITICAL, exit-code: "0", ignore-unfixed: true }
      - name: Smoke test do container (read-only, não-root)
        run: |
          docker run -d --name fg --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -p 8000:8000 fraudguard:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health | grep '"status":"ok"'
          curl -fs -X POST localhost:8000/predict -H 'content-type: application/json' \
            -d "$(python3 -c 'import json;print(json.dumps({"Time":1.0,"Amount":10.0,**{f"V{i}":0.0 for i in range(1,29)}}))')" | grep decision
          test "$(docker inspect -f '{{.Config.User}}' fg)" = "10001:10001"
          docker logs fg | head -20
