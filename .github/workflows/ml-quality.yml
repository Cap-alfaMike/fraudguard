name: ml-quality

on:
  workflow_dispatch:
  schedule: [{ cron: "0 6 * * 1" }]  # segundas, 06:00 UTC
  push: { branches: [main], paths: ["src/fraudguard/modeling/**", "src/fraudguard/ews/**", "artifacts/**", "scripts/**"] }

permissions: { contents: read }

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Treinar o modelo neste runner
        # Dados sintéticos dependem de exp/sin do NumPy, cuja implementação SIMD varia por CPU;
        # um único bit diferente muda a impressão digital. Treinar aqui garante que modelo e
        # dados de avaliação nasçam na mesma máquina (a avaliação recusa dados diferentes).
        run: PYTHONPATH=src python -m fraudguard.modeling.train --no-plots
      - name: Diagnóstico da impressão digital dos dados
        run: |
          PYTHONPATH=src python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from fraudguard.data.loader import load_dataset
          from fraudguard.modeling.train import _data_fingerprint
          df, src = load_dataset(None)
          meta = json.load(open("artifacts/model_metadata.json"))
          print(f"Fonte: {src}; impressão digital dos dados: `{_data_fingerprint(df)}`; do modelo: `{meta['data']['fingerprint']}`")
          PY
      - name: Testes comportamentais do modelo
        run: PYTHONPATH=src pytest tests/behavioral -q --no-cov
      - name: Intervalos de confiança (block bootstrap)
        run: PYTHONPATH=src python scripts/evaluate_uncertainty.py --n-boot 500
      - name: Monitoramento com rótulos atrasados
        run: PYTHONPATH=src python scripts/batch_monitor.py
      - name: Resumo no job
        run: cat reports/UNCERTAINTY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ml-quality-reports
          path: |
            reports/UNCERTAINTY.md
            reports/uncertainty.json
            reports/BATCH_MONITORING.md
            reports/figures/uncertainty_*.png
            reports/figures/label_maturation.png
