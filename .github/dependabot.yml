version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      ml-stack: { patterns: ["numpy", "pandas", "scipy", "scikit-learn", "lightgbm", "joblib"] }
      web-stack: { patterns: ["fastapi", "uvicorn*", "pydantic*", "httpx"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
